name: Update profile

on:
  workflow_dispatch:
  schedule:
    - cron: '15 22 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'profile.config.json'
      - 'package*.json'
      - 'assets/source/forest-with-title.png'
      - '.github/workflows/update-profile.yml'

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install fonts and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          npm ci --no-audit --no-fund
      - name: Generate JLU project card
        uses: stats-organization/github-readme-stats-action@96a939a7398a290e0a9f84b2b31d21d0cf67d483 # v2
        with:
          card: pin
          options: username=sorastyx&repo=JLU-&bg_color=ffffff&title_color=0969da&text_color=656d76&icon_color=656d76&border_color=d8dee4&border_radius=6&show_owner=false
          path: assets/generated/project-0.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true
      - name: Generate Transformer project card
        uses: stats-organization/github-readme-stats-action@96a939a7398a290e0a9f84b2b31d21d0cf67d483 # v2
        with:
          card: pin
          options: username=sorastyx&repo=My-Transformer&bg_color=ffffff&title_color=0969da&text_color=656d76&icon_color=656d76&border_color=d8dee4&border_radius=6&show_owner=false
          path: assets/generated/project-1.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true
      - name: Update public data and build cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build
      - name: Verify generated profile
        run: npm run check
      - name: Commit updated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md data assets/generated assets/source/media
          if ! git diff --cached --quiet; then
            git commit -m 'Update profile cards and public collections'
            git pull --rebase origin main
            git push
          fi
