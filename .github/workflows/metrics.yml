name: Detailed Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
    steps:
      - name: Generate detailed public metrics when configured
        if: env.METRICS_TOKEN != ''
        uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d # master snapshot
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: sorastyx
          filename: assets/generated/metrics.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Shanghai
          config_display: large
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_details: percentage
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_stars: yes
          plugin_stars_limit: 3
          plugin_people: yes
          plugin_people_types: followers, following
          plugin_people_limit: 16
          extras_css: |
            :root { --color-text: #656d76; --color-text-primary: #0969da; }
      - name: Explain optional setup
        if: env.METRICS_TOKEN == ''
        run: echo 'Detailed Metrics is optional. Add METRICS_TOKEN in repository secrets to enable it. Public cards remain available.'
